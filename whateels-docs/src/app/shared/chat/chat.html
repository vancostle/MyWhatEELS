<div class="chat" [style.display]="isChatOpen() ? 'flex' : 'none'">
    <div class="carrousel">

        @if (isEmailAdminOpen()) {
            <app-email-admin></app-email-admin>
        } @else if (isEmailStatusOpen()) {
            <app-email-status></app-email-status>
        }
    </div>
</div>

<button (click)="toggleChat()" [class.activate]="isChatOpen()">
    <i class="fa-regular fa-message"></i>
</button>
