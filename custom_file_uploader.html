<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            place-items: center;

            height: 100vh;
            width: 100%;
            margin: 0;
            padding: 0;

            padding: 10px;
        }

        .wrapper {
            width: 275px;
            height: 70px;

            position: relative;
            display: flex;

            overflow: clip;
            position: relative;

            border-radius: 9px;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            box-shadow: 0px 0px 3px rgba(0, 0, 0, 0.1);
        }

        #file-zone {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 0;
            width: inherit;

            background-color: #f1f1f1;

            & > h2 {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #35373b;
                font-size: 16px;
                font-weight: normal;

                max-width: 100%;
                padding: 0 12px;

                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            &:hover {
                background-color: rgb(240, 240, 240);
                cursor: pointer;
                border-color: rgb(43, 43, 43);

                & > h2 {
                    color: rgb(43, 43, 43);
                }
            }
        }

        section.state {
            position: absolute;
            z-index: 1;

            transition: transform 0.7s cubic-bezier(.68,-0.55,.27,1.55);
            
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;

            width: 100%;
            height: 100%;
            padding: 7px;
            
            z-index: 1;

            & > div {
                display: flex;
                flex: 1;
                width: inherit;
                height: inherit;
                align-items: center;
                justify-content: space-between;
                border-radius: 8px;
                padding: .5rem 1rem;
                gap: .5rem;

                box-shadow: 0px 0px 3px rgba(0, 0, 0, 0.1);
                color: white;
                width: inherit;

                & > p {
                    flex: 1;
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    font-size: 18px;
                    max-width: 100%;
                    padding: 0;

                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }
            }
        }

        section.state.loading {
            top: -50%;
            left: 50%;
            transform: translate(-50%, -50%);

            & > div {
                background-color: #3182ce;
            }

            & .spinner {
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-top: 4px solid white;
                border-radius: 50%;
                width: 24px;
                height: 24px;
                animation: spin 1s linear infinite;
            }
        }

        section.state.success {
            top: 50%;
            left: 100%;
            transform: translate(0%, -50%);

            & > div {
                background-color: #38a170;
            }

            & .remove-file {
                background-color: #1b650c;
            }
        }

        section.state.failed {
            top: 50%;
            right: 100%;
            transform: translate(0%, -50%);

            & > div {
                background-color: rgb(170, 19, 19);
            }

            & .remove-file {
                background-color: rgb(80, 13, 13);
            }
        }

        .remove-file {
            width: 24.5px;
            height: 24.5px;

            min-width: 24.5px;
            min-height: 24.5px;

            border: 0;
            border-radius: 50%;
            box-shadow: none;

            display: grid;
            place-items: center;

            position: relative;

            rotate: 45deg;
            transition: scale 0.2s ease-in-out, background-color 0.2s ease-in-out;

            &::before, &::after {
                content: '';
                position: absolute;
                width: 4px;
                height: calc(100% - 8px);
                background-color: white;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                border-radius: 2px;
                transition: background-color 0.2s ease-in-out;
            }

            &::after {
                /* Centered horizontally, vertical bar */
                transform: translate(-50%, -50%) rotate(90deg);
            }

            &:hover {
                cursor: pointer;
                scale: 1.2;
                background-color: white;
            }
        }

        section.state.loading.actived-reading-file-state {
            transform: translate(-50%, 50%);
        }

        section.state.success.actived-success-state {
            transform: translate(-100%, -50%);
        }

        section.state.failed.actived-failed-state {
            transform: translate(100%, -50%);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <section id="file-zone" title="Click to select a dm3 or dm4 file">
            <h2>Click to select a dm3 or dm4 file wefwef wefwfwfwefwe werfwefwefew</h2>
        </section>
        <section class="loading state">
            <div>
                <p>
                    Reading file...
                </p>
                <div class="spinner"></div>
            </div>
        </section>
        <section class="success state">
            <div>
                <p>
                    STEM SI_HL.dm4 
                </p>
                <button class="remove-file success"></button>
            </div>
        </section>
        <section class="failed state">
            <div>
                <p>
                    Failed to upload file!
                </p>
                <button class="remove-file failed"></button>
            </div>
        </section>
    </div>

    <div>
        <button class="active-success-button">
            Activate success
        </button>
        <button class="active-failed-button">
            Activate failed
        </button>
        <button class="active-reading-file-button">
            Activate reading file
        </button>
    </div>

</body>
<script>
    const fileZone = document.querySelector('#file-zone');
    fileZone.addEventListener('click', _ => {
        console.log('clicked');
    })

    const activeSuccessBtn = document.querySelector('.active-success-button');
    const activeFailedBtn = document.querySelector('.active-failed-button');
    const activeReadingFileBtn = document.querySelector('.active-reading-file-button');

    activeSuccessBtn.addEventListener('click', _ => {
        const successSection = document.querySelector('.success');
        successSection.classList.toggle('actived-success-state');
    });

    activeFailedBtn.addEventListener('click', _ => {
        const failedSection = document.querySelector('.failed');
        failedSection.classList.toggle('actived-failed-state');
    });

    activeReadingFileBtn.addEventListener('click', _ => {
        const loadingSection = document.querySelector('.loading');
        loadingSection.classList.toggle('actived-reading-file-state');
    });

    const removeFileSuccessBtn = document.querySelector('.remove-file.success');
    const removeFileFailedBtn = document.querySelector('.remove-file.failed');

    removeFileSuccessBtn.addEventListener('click', _ => {
        const successSection = document.querySelector('.success');
        successSection.classList.remove('actived-success-state');
    });

    removeFileFailedBtn.addEventListener('click', _ => {
        const failedSection = document.querySelector('.failed');
        failedSection.classList.remove('actived-failed-state');
    });

</script>
</html>
