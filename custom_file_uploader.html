<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            place-items: center;

            height: 100vh;
            width: 100%;
            margin: 0;
            padding: 0;

            padding: 10px;
        }

        h2, p {
            font-size: .9rem;
            font-weight: normal;
        }

        .component-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 275px;
            height: auto;
        }

        .file-uploader-wrapper {
            width: 100%;
            height: 70px;

            position: relative;
            display: flex;

            overflow: clip;
            position: relative;

            border-radius: 9px;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
        }

        .path-option-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 0 .5rem 0 .5rem;
            gap: .25rem;

            width: 100%;

            & > form {
                padding: .5rem;
                width: 100%;

                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                background-color: #f8f8f8;
                overflow: clip;
                border-radius: 0 0 8px 8px;
                box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.1);
                gap: .5rem;

                & input {
                    display: flex;
                }

                & input:not([type="submit"]) {
                    flex: 1;
                    padding: .5rem;
                    border-radius: 4px;
                    border: 1px solid #ccc;
                }

                & input[type="submit"] {
                    /* flex: 1; */
                    width: auto;
                    background-color: #3182ce;
                    color: white;
                    border: none;
                    padding: .5rem 1rem;
                    cursor: pointer;
                    transition: background-color 0.2s ease-in-out;
                    border-radius: 4px;

                    &:hover {
                        background-color: #2c6cb0;
                    }
                }
            }
        }

        #file-zone {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 0;
            width: inherit;
            height: inherit;
            background-color: #f1f1f1;

            & h2 {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #35373b;

                max-width: 100%;
                padding: 0 12px;

                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            &:hover {
                background-color: rgb(240, 240, 240);
                cursor: pointer;
                border-color: rgb(43, 43, 43);

                & h2 {
                    color: rgb(43, 43, 43);
                    text-decoration: underline;
                }
            }
        }

        section.state {
            position: absolute;
            z-index: 1;

            transition: transform 0.7s cubic-bezier(.68,-0.55,.27,1.55);
            
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;

            width: 100%;
            height: 100%;
            padding: 7px;
            
            z-index: 1;

            & > div {
                display: flex;
                flex: 1;
                width: inherit;
                height: inherit;
                align-items: center;
                justify-content: space-between;
                border-radius: 8px;
                padding: .5rem 1rem;
                gap: .5rem;

                box-shadow: 0px 0px 4px rgba(0, 0, 0, 0.2);
                color: white;
                width: inherit;

                & > p {
                    flex: 1;
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    max-width: 100%;
                    padding: 0;

                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }
            }
        }

        section.state.loading {
            top: -50%;
            left: 50%;
            transform: translate(-50%, -50%);

            & > div {
                background-color: #3182ce;
            }

            & .spinner {
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-top: 4px solid white;
                border-radius: 50%;
                width: 24px;
                height: 24px;
                animation: spin 1s linear infinite;
            }
        }

        section.state.opening {
            top: 150%;
            left: 50%;
            transform: translate(-50%, -50%);

            & > div {
                background-color: #a0aec0;
            }

            & .spinner {
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-top: 4px solid white;
                border-radius: 50%;
                width: 24px;
                height: 24px;
                animation: spin 1s linear infinite;
            }
        }

        section.state.success {
            top: 50%;
            left: 100%;
            transform: translate(0%, -50%);

            & > div {
                background-color: #38a170;
            }

            & .remove-file {
                background-color: #1b650c;
            }
        }

        section.state.failed {
            top: 50%;
            right: 100%;
            transform: translate(0%, -50%);

            & > div {
                background-color: rgb(170, 19, 19);
            }

            & .remove-file {
                background-color: rgb(80, 13, 13);
            }
        }

        .remove-file {
            width: 24.5px;
            height: 24.5px;

            min-width: 24.5px;
            min-height: 24.5px;

            border: 0;
            border-radius: 50%;
            box-shadow: none;

            display: grid;
            place-items: center;

            position: relative;

            rotate: 45deg;
            transition: scale 0.2s ease-in-out, background-color 0.2s ease-in-out;

            &::before, &::after {
                content: '';
                position: absolute;
                width: 4px;
                height: calc(100% - 8px);
                background-color: white;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                border-radius: 2px;
                transition: background-color 0.2s ease-in-out;
            }

            &::after {
                /* Centered horizontally, vertical bar */
                transform: translate(-50%, -50%) rotate(90deg);
            }

            &:hover {
                cursor: pointer;
                scale: 1.2;
                background-color: white;
            }
        }

        section.state.opening.actived-opening-dialog-state {
            transform: translate(-50%, -150%);
        }

        section.state.loading.actived-reading-file-state {
            transform: translate(-50%, 50%);
        }

        section.state.success.actived-success-state {
            transform: translate(-100%, -50%);
        }

        section.state.failed.actived-failed-state {
            transform: translate(100%, -50%);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="component-wrapper">
        <div class="file-uploader-wrapper">
            <section id="file-zone" title="Click to select a dm3 or dm4 file">
                <h2>Click to select a dm3 or dm4 file</h2>
            </section>
            <section class="opening state">
                <div>
                    <p>
                        Opening dialog...
                    </p>
                    <div class="spinner"></div>
                </div>
            </section>
            <section class="loading state">
                <div>
                    <p>
                        Reading file...
                    </p>
                    <div class="spinner"></div>
                </div>
            </section>
            <section class="success state">
                <div>
                    <p>
                        STEM SI_HL.dm4 
                    </p>
                    <button class="remove-file success"></button>
                </div>
            </section>
            <section class="failed state">
                <div>
                    <p>
                        Failed to upload file!
                    </p>
                    <button class="remove-file failed"></button>
                </div>
            </section>
        </div>
        <div class="path-option-wrapper">
            <form>
                <input type="text" placeholder="Or paste the file path here">
                <input type="submit" value="Submit">
            </form>
        </div>
    </div>

    <div>
        <button class="active-open-dialog-button">
            Activate open dialog
        </button>
        <button class="active-success-button">
            Activate success
        </button>
        <button class="active-failed-button">
            Activate failed
        </button>
        <button class="active-reading-file-button">
            Activate reading file
        </button>
    </div>
</body>

<script>
    const fileZone = document.getElementById('file-zone');
    const openingSection = document.querySelector('section.opening');
    const loadingSection = document.querySelector('section.loading');
    const successSection = document.querySelector('section.success');
    const failedSection = document.querySelector('section.failed');

    const openFileDialog = _ => {
        openingSection.classList.add('actived-opening-dialog-state');
        loadingSection.classList.remove('actived-reading-file-state');
        successSection.classList.remove('actived-success-state');
        failedSection.classList.remove('actived-failed-state');
    }

    const activateLoadingState = _ => {
        loadingSection.classList.add('actived-reading-file-state');
        openingSection.classList.remove('actived-opening-dialog-state');
        successSection.classList.remove('actived-success-state');
        failedSection.classList.remove('actived-failed-state');
    }

    const activateSuccessState = _ => {
        successSection.classList.add('actived-success-state');
        openingSection.classList.remove('actived-opening-dialog-state');
        loadingSection.classList.remove('actived-reading-file-state');
        failedSection.classList.remove('actived-failed-state');
    }

    const activateFailedState = _ => {
        failedSection.classList.add('actived-failed-state');
        openingSection.classList.remove('actived-opening-dialog-state');
        loadingSection.classList.remove('actived-reading-file-state');
        successSection.classList.remove('actived-success-state');
    }

    document.querySelector('.active-open-dialog-button').addEventListener('click', openFileDialog);
    document.querySelector('.active-reading-file-button').addEventListener('click', activateLoadingState);
    document.querySelector('.active-success-button').addEventListener('click', activateSuccessState);
    document.querySelector('.active-failed-button').addEventListener('click', activateFailedState);

</script>
