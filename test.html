<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Starting {APP_NAME}…</title>
  <style>
    :root {
        --fill-color: #f7f7f7;
    }
    *, *::before, *::after {
        box-sizing: border-box; 
        margin: 0; padding: 0; 
    }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh;
      font-family: system-ui, sans-serif;
      background: var(--fill-color);
    }
    div.wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        & h1 {
            font-size: 1.6rem;
            color: #1b1b1b;
        }
    }
    .bouncing-dots {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        height: 32px;
        margin-top: 0.5rem;
        gap: 0.5rem;
    }
    .dot {
        width: 12px;
        height: 12px;
        background: #1b1b1b;
        border-radius: 50%;
        display: inline-block;
        animation: bounce 0.8s infinite;
    }
    .images {
        display: grid;
        place-items: center;
        position: relative;
        height: 300px;

        & img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            &:last-of-type {
                animation: rotate 10s ease-in-out infinite;
            }
        }
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }

    footer {
        position: absolute;
        bottom: 10px;
        font-size: 0.9rem;
        color: var(--fill-color);
    }

    @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-16px); }
    }

    @keyframes rotate {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    
  </style>
</head>
<body>
    <div class="wrapper">
        <div class="images">
            <img src="./whateels/assets/img/w.svg" alt="WhatEELS W Logo" width="165" />
            <img src="./whateels/assets/img/eel.svg" alt="WhatEELS Eel Logo" width="300" />
        </div>
        <div class="bouncing-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>
    <footer>
        <address>
            Andry Alexis Reyes Cruz
        </address>
    </footer>
  <script>
    const TARGET = 'http://localhost:{PORT}/';
    const STATUS  = document.getElementById('status');
    let attempt = 0;
    async function probe() {{
      attempt++;
      STATUS.textContent = `Attempt ${{attempt}} — waiting for server…`;
      try {{
        await fetch(TARGET, {{ mode: 'no-cors' }});
        STATUS.textContent = 'Ready! Redirecting…';
        window.location.replace(TARGET);
      }} catch (_) {{
        setTimeout(probe, 500);
      }}
    }}
    probe();
  </script>
</body>
</html>
