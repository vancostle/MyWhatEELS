[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whateels"
version = "0.1.0"
description = "EELS analysis desktop application built with Panel and HoloViews"
readme = "readme.md"
requires-python = ">=3.13"
authors = [
    { name = "Vanessa Costa Ledesma" },
    { name = "Andry Alexis Reyes Cruz" },
]

dependencies = [
    # Core scientific stack
    "numpy==2.3.3",
    "scipy==1.16.2",
    "pandas==2.3.2",
    "xarray==2025.6.1",
    "numba==0.62.0",
    "llvmlite==0.45.0",

    # UI and visualization
    "panel==1.7.1",
    "bokeh==3.7.3",
    "holoviews==1.20.2",
    "matplotlib==3.10.6",
    "param==2.2.1",
    "pyviz-comms==3.0.6",
    "tornado==6.5.2",

    # Data analysis and fitting
    "scikit-learn==1.7.2",
    "lmfit==1.3.4",
    "umap-learn==0.5.11",
    "hdbscan==0.8.41",

    # DM file reading
    "rosettasciio==0.14.0",

    # App utilities
    "psutil==6.1.1",
    "csscompressor==0.9.5",
    "rjsmin==1.2.4",
]

[project.optional-dependencies]
build = [
    "pyinstaller==6.16.0",
    "pyinstaller-hooks-contrib==2025.8",
    "pefile==2023.2.7",
    "pywin32-ctypes==0.2.3",
]

[tool.setuptools.packages.find]
include = ["whateels*"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
